name: infrarisk
channels:
  - conda-forge
  - defaults
dependencies:
  # Core Python
  - python>=3.9,<3.12
  
  # Development tools
  - pip
  - setuptools
  - wheel
  
  # Code quality
  - black
  - pylint
  - isort
  
  # Jupyter
  - jupyterlab
  - ipykernel
  - ipywidgets
  - notebook
  
  # Scientific computing
  - numpy
  - pandas
  - scipy
  - scikit-learn
  
  # Visualization
  - matplotlib
  - seaborn
  - plotly
  - bokeh
  
  # Network analysis
  - networkx
  
  # Geospatial
  - geopandas
  - shapely
  - fiona
  - rasterio
  - pyproj
  - contextily
  - folium
  - geopy
  
  # Optimization
  - pyomo
  
  # Other dependencies via pip
  - pip:
    - wntr>=0.3.0
    - pandapower>=2.6.0
    - click>=8.0.0
    - pyyaml>=6.0
    - requests>=2.28.0
    - openpyxl>=3.0.0
    - xlrd>=2.0.0
    - xlsxwriter>=3.0.0
    - h5py>=3.1.0
    - tqdm>=4.64.0
    - joblib>=1.2.0
    - pillow>=9.2.0
    - numba>=0.56.0
